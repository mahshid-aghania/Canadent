<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canadent + ConfiDentist</title>
  <style>
    :root { --ink:#132238; --muted:#5b6b7c; --can:#0b6e4f; --conf:#0b4f8a; --bg:#f3f6f9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:
      radial-gradient(1200px 600px at 10% -10%, #d9efe6 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #d7e6f6 0%, transparent 50%),
      var(--bg); min-height:100vh; }
    main { max-width: 920px; margin: 0 auto; padding: 72px 24px 96px; }
    h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); line-height:1.05; margin:0 0 12px; letter-spacing:-0.02em; }
    p.lead { font-size:1.15rem; color:var(--muted); max-width:40ch; margin:0 0 40px; }
    .grid { display:grid; gap:18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.card { display:block; text-decoration:none; color:inherit; padding:28px; border-radius:18px; background:#fff; border:1px solid rgba(19,34,56,.08); transition: transform .2s ease, box-shadow .2s ease; }
    a.card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(19,34,56,.12); }
    a.card.can { border-top: 4px solid var(--can); }
    a.card.conf { border-top: 4px solid var(--conf); }
    .eyebrow { font-family: system-ui, sans-serif; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    a.card h2 { margin:0 0 8px; font-size:1.7rem; }
    a.card p { margin:0; color:var(--muted); line-height:1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Canadent + ConfiDentist</h1>
    <p class="lead">Local static mirrors of both dental education sites, sanitized for offline browsing.</p>
    <div class="grid">
      <a class="card can" href="/canadent/">
        <div class="eyebrow">Continuing education</div>
        <h2>Canadent</h2>
        <p>Courses, shop, and events from canadent.net</p>
      </a>
      <a class="card conf" href="/confidentist/">
        <div class="eyebrow">NDEB exam prep</div>
        <h2>ConfiDentist</h2>
        <p>AFK, ACJ, NDECC and training programs from confidentist.ca</p>
      </a>
    </div>
  </main>
</body>
</html>
